name: setup
description: Install the devshell, restore the caches and install the packages.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    - name: Restore the pnpm and Go caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/pnpm/store
          ~/go/pkg/mod
          ~/.cache/go-build
        key: packages-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/go.sum') }}
        restore-keys: packages-${{ runner.os }}-

    - name: Restore the Nx cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.sha }}
        restore-keys: nx-${{ runner.os }}-

    - name: Install the packages
      shell: bash
      run: nix develop --command pnpm install --frozen-lockfile

feature:
  name: visitor-lists

components:
  API:
    requirements:
      1: The API keeps a separate task list for each visitor, selected by a random id in the `todo_list` cookie.
      2: The cookie is `HttpOnly`, `Secure` and `SameSite=Lax`. Only the server chooses its value; an unknown value gets a new list and a new cookie.
      3: Only requests under `/api/` create a list, and their responses send `Cache-Control: no-store`.
      4: The API holds at most 1,000 lists and evicts the least recently used one to make room.
      5: "`POST /api/tasks` returns 409 and stores nothing when the list already holds 50 tasks."
      6: "`POST /api/tasks` returns 400 and stores nothing when the trimmed title is over 200 characters."
      7: "`POST /api/tasks` and `PATCH /api/tasks/{id}` return 413 when the body is over 4,096 bytes."
  PAGE:
    requirements:
      1: When the API refuses a new task, the page shows the API's message and keeps the title.
  DEPLOY:
    requirements:
      1: With `WEB_DIR` set, the API serves that folder, so the `app` image holds the page and the API on one origin.
      2: "`fly.toml` runs one machine, because the lists live in its memory and end when it stops."
      3: "`fly.toml` deploys bluegreen: when the new machine fails its health check, Fly deletes it and the old machine keeps serving."

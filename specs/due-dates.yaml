feature:
  name: due-dates
  issue: 1

components:
  MODEL:
    requirements:
      1: A task has an optional `dueDate`, a calendar date written `YYYY-MM-DD`.
      2: A task without a due date omits `dueDate` from its JSON.
      3: The TypeScript `Task`, `task.schema.json` and the Go `Task` describe the same fields.
  API:
    requirements:
      1: "`POST /api/tasks` accepts an optional `dueDate`."
      2: "`POST /api/tasks` returns 400 and stores nothing when `dueDate` is present but not a real calendar date, including an empty string."
      3: "`POST /api/tasks` accepts a `dueDate` in the past."
      4: "`PATCH /api/tasks/{id}` never changes `dueDate`."
      5: "`GET /api/tasks` accepts an optional `today=YYYY-MM-DD` and falls back to the API's local date without it."
      6: "`GET /api/tasks` returns 400 when `today` is not a real calendar date."
      7: A task is overdue when it is not completed and its `dueDate` is before `today`.
      8: "`GET /api/tasks` returns overdue tasks by due date, then other dated tasks by due date, then undated tasks; within a group, tasks with the same due date keep the order added."
  PAGE:
    requirements:
      1: The add form has an optional date input; when it is empty, the request omits `dueDate`.
      2: The page requests tasks with `today` set to the browser's local date.
      3: A row with a due date shows the date in the browser's locale format.
      4: An overdue row shows a red chip with the text "Overdue"; a completed row never shows it.
      5: After a task is added or its completion changes, the list shows the API's order.
  DOCS:
    requirements:
      1: "`docs/reference/api.md` and `README.md` describe `dueDate`, `today` and the sort order."
